<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Redirect to index.html while preserving the path for the SPA
      var path = location.pathname.replace('/lumbini-technologies-website', '');
      var search = location.search || '';
      var hash = location.hash || '';
      location.replace('/lumbini-technologies-website/index.html?redirect=' + encodeURIComponent(path + search + hash));
    </script>
  </head>
  <body>Redirecting…</body>
</html>
